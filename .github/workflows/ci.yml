name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Install the toolchain from mise.toml (pins node + bun); no version is
      # hardcoded here — mise.toml is the single source of truth.
      - uses: jdx/mise-action@v4

      - run: bun install --frozen-lockfile

      # The released ki tag lives in .github/ki-version so that the
      # update-ki-pin.yml receiver can propose its bump.
      - name: Read released KI pin
        run: |
          set -euo pipefail
          KI_VERSION=$(tr -d '[:space:]' < .github/ki-version)
          [[ "$KI_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'KI_VERSION=%s\n' "$KI_VERSION" >> "$GITHUB_ENV"

      - name: Install released KI
        env:
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          XDG_STATE_HOME: ${{ runner.temp }}/ki/state
          KI_STATE_HOME: ${{ runner.temp }}/ki/state/ki
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude" "$HOME/.config/ki"
          printf '{}\n' > "$HOME/.claude/settings.json"
          printf 'mcpServers: []\n' > "$HOME/.config/ki/mcp-servers.yaml"
          curl --fail -sSL --proto '=https' -o "$RUNNER_TEMP/install.sh" "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "${KI_VERSION#v}"
          ki bootstrap
          ki registry add --repo .
          local_harness=$(realpath "$GITHUB_WORKSPACE")
          ki dev local set knowledgeislands/ki-agentic-harness "$local_harness"
          ki dev local on knowledgeislands/ki-agentic-harness
          full_diag=$(ki diag --full)
          grep -F "source: $local_harness" <<<"$full_diag"
          grep -F 'mode: on' <<<"$full_diag"
          ki repo repair --repo .
          project_key=${GITHUB_WORKSPACE//\//-}
          mkdir -p "$HOME/.claude/projects/$project_key/memory"
          touch "$HOME/.claude/projects/$project_key/memory/MEMORY.md"
          diag=$(ki diag)
          grep -F 'Configuration: valid' <<<"$diag"
          grep -F 'Registry: valid' <<<"$diag"
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'XDG_STATE_HOME=%s\n' "$XDG_STATE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"

      # The native read-only gate resolves the repository's declared skills from the
      # verified active harness collection and runs their registered operations.
      - name: Audit
        run: ki repo audit --repo .

      # The harness self-test suite (rubric, payload, and hook tests).
      - name: Test
        run: bun run test
