[thread-model]
type = "workflow"
question = "What steps does a piece of owner-directed work take, from the owner's message through a coordinating thread and a detached agent to the report, the mark and Project close?"
audience = "The owner, coordinating threads and agents learning how threads and background runs fit together"
traced = ["skills/change-management/ki-coordination/references/standards-coordination.md", "skills/governance/ki-delegation/references/standards-background-runs.md"]
stale_when = "a step of the coordinating-thread loop, the run packet, the report-and-DONE hand-off, the mark or Project close changes in either standard, or a cited heading moves"
regenerate = "Re-trace the thread loop from the ki-coordination and ki-delegation standards at HEAD, keeping the five lanes and the layout where the facts hold, cite each node's source heading by line at the pinned revision, then run `bun run self:diagrams:html --svg thread-model` to finalize it at showcase quality, commit its HTML and re-export the SVG."
last_checked = "b7d3b53e42de9de3d48a6087a810b1f3004cf2cd"
commit_html = true
