# Living diagrams manifest: one table per diagram, keyed by its slug.
# See the ki-diagrams standard for each field.

[skill-map]
type = "architecture"
question = "What skills does the harness hold, in which source concern does each live, which functional areas does each serve, and what shape is each?"
audience = "Skill authors, reviewers and newcomers orienting themselves in the collection"
traced = ["skills/*/*/SKILL.md"]
stale_when = "a skill is added, moved between concerns, renamed or removed, its ki-kind or ki-applicability changes, or the functional-area table changes"
regenerate = "Run `bun skills/repository/ki-repo-harness/scripts/skill-graph.ts --write` to derive the source from the skills layout and SKILL.md frontmatter, then run `bun run self:diagrams:html --svg skill-map` to finalize it at showcase quality, commit its HTML and re-export the SVG. Do not hand-draw it."
last_checked = "80fde15b648d3a93ab4a0a16c46e4c0dcab05a1a"
commit_html = true

