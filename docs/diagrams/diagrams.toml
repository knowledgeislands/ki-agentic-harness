# Living diagrams manifest: one table per diagram, keyed by its slug.
# See the ki-diagrams standard for each field.

[skill-map]
type = "architecture"
question = "What skills does the harness hold, in which source concern does each live, which functional areas does each serve, and what shape is each?"
audience = "Skill authors, reviewers and newcomers orienting themselves in the collection"
traced = ["skills/*/*/SKILL.md"]
stale_when = "a skill is added, moved between concerns, renamed or removed, its ki-kind or ki-applicability changes, or the functional-area table changes"
regenerate = "Run `bun skills/repo-structure/ki-repo-harness/scripts/skill-graph.ts --write` to derive the source from the skills layout and SKILL.md frontmatter, then run `bun run self:diagrams:html --svg skill-map` to finalize it at showcase quality, commit its HTML and re-export the SVG. Do not hand-draw it."
last_checked = "8f4005240c3002a64af17add4bc8e878fd7e2ccd"
commit_html = true

[skill-area-fundamentals]
type = "architecture"
question = "Which outside skills do the Fundamentals skills rely on, which outside skills rely on them, and how do they rely on each other?"
audience = "Skill authors and reviewers deciding where a new or changed skill sits"
traced = ["skills/*/*/SKILL.md"]
stale_when = "a skill joins or leaves the Fundamentals functional area, or one of its skills is moved, renamed or removed, its ki-applicability changes, or a ki-depends-on or ki-optional-depends-on declaration to or from one of its skills changes"
regenerate = "Run `bun skills/repo-structure/ki-repo-harness/scripts/skill-graph.ts --write` to derive the source from the skills layout, SKILL.md frontmatter and the functional-area table, then run `bun run self:diagrams:html --svg skill-area-fundamentals` to finalize it at showcase quality, commit its HTML and re-export the SVG. Do not hand-draw it."
