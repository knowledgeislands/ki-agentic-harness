# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-agentic-harness"
title = "ki-agentic-harness"
description = "Knowledge Islands agentic harness — canonical home for Agent Skills, Agents, MCP servers, and Evals across the Knowledge Islands ecosystem."
repo_code = "KI-HARNESS"
visibility = "public"
license = "MIT"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
checks.coverage-checkpoint = false # source repository publishes the optional capability without adopting a checkpoint subarea
checks.coverage-subagents-codex = false # source repository publishes the adapter without adopting Codex agent projections

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-harness]
prefix = "ki"

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-binding]

[skills.ki-binding-claude]

[skills.ki-binding-codex]

[skills.ki-skills]

[skills.ki-subagents]

[skills.ki-subagents-claude]

[skills.ki-subagents-codex]

[skills.ki-decision-records]

[skills.ki-delegation]

[skills.ki-specs]

[skills.ki-guides]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-housekeeping-claude]

[skills.ki-housekeeping-codex]

[skills.ki-housekeeping-chatgpt]

[skills.ki-acquire-chatgpt]

[skills.ki-acquire-granola]

[skills.ki-work-housekeeping]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
areas.FND = "foundation-tooling"
areas.GOV = "governance-consistency"
areas.OPS = "operations"
areas.REV = "regular-reviews"
areas.RTP = "runtime-portability"

[skills.ki-checkpoint]

[skills.ki-tokenomics]
headroom = "recommended"
# Cross-skill governance benefits from the higher-reasoning project default.
preferred_model_type = "reasoning"
budgets.mcp_servers = 20 # User-scoped; revisit if the global MCP set is pruned.

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-model-radar]

[skills.ki-agentic-radar]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
routes."knowledgeislands/ki-website" = { export = ["knowledge"] }
routes."knowledgeislands/tools-ki" = { export = ["work", "knowledge"] }
routes."knowledgeislands/tools-mgit" = { export = ["work", "knowledge"] }
routes."knowledgeislands/ki-arcadia-principal" = { export = ["knowledge"], import = ["knowledge"] }
routes."krisb/dotfiles" = { export = ["work", "knowledge"] }
routes."knowledgeislands/ki-specifications" = { export = ["work", "knowledge"], import = ["work", "knowledge"] }
routes."knowledgeislands/ki-techne-principal" = { export = ["work", "knowledge"], import = ["work", "knowledge"] }
routes."knowledgeislands/ki-plugins" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-housekeeping-claude" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-housekeeping-codex" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-housekeeping-chatgpt" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-git-audit" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-gsuite" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-ki-kb-fs" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-ki-kb-notion-mirror" = { export = ["knowledge"] }
routes."knowledgeislands/mcp-m365" = { export = ["knowledge"] }

[skills.ki-agora]
memberships.ki-all = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "governance-harness" }
memberships.ki-fnd = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "governance-harness" }
memberships.ki-tools = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "governance-harness" }

[skills.ki-agora.homes.ki-mcps]
owner = "https://github.com/knowledgeislands/ki-agentic-harness"
purpose = "Knowledge Islands MCP repositories"

[skills.ki-agora.homes.ki-mcps.members]
"https://github.com/knowledgeislands/mcp-acquire-whatsapp" = "maintainer"
