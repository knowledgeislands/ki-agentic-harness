# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repo_type = "project"
primary_shape = "ki-repo-harness"
repository = "https://github.com/knowledgeislands/ki-agentic-harness"
title = "ki-agentic-harness"
capital = "https://github.com/knowledgeislands/ki-arcadia-principal"
description = "Knowledge Islands agentic harness — canonical home for Agent Skills, Agents, Evals, and Hooks across the ecosystem."
repo_code = "KI-HARNESS"
visibility = "public"
license = "MIT"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
checks.coverage-checkpoint = false # source repository publishes the optional capability without adopting a checkpoint subarea
checks.coverage-subagents-chatgpt = false # source repository publishes the adapter without adopting Codex agent projections

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-harness]
prefix = "ki"

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-binding]

[skills.ki-binding-claude]

[skills.ki-binding-chatgpt]

[skills.ki-skills]

[skills.ki-subagents]

[skills.ki-subagents-claude]

[skills.ki-subagents-chatgpt]

[skills.ki-agent-coordination-paperclip]
organisation_code = "KIS"

[skills.ki-decision-records]

[skills.ki-delegation]

[skills.ki-specs]

[skills.ki-guides]

