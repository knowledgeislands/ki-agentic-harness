[skills.ki-trades.routes."knowledgeislands/ki-plugins"]
export = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/mcp-housekeeping-claude"]
export = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/mcp-housekeeping-codex"]
