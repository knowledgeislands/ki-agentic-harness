# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-agentic-harness"
title = "ki-agentic-harness"
description = "Knowledge Islands agentic harness — canonical home for Agent Skills, Agents, Evals, and Hooks across the ecosystem."
repo_code = "KI-HARNESS"
visibility = "public"
license = "MIT"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
checks.coverage-checkpoint = false # source repository publishes the optional capability without adopting a checkpoint subarea
checks.coverage-subagents-codex = false # source repository publishes the adapter without adopting Codex agent projections

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-harness]
prefix = "ki"

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-binding]

[skills.ki-binding-claude]

[skills.ki-binding-codex]

[skills.ki-skills]

[skills.ki-subagents]

[skills.ki-subagents-claude]

[skills.ki-subagents-codex]

[skills.ki-agent-coordination-paperclip]

[skills.ki-decision-records]

[skills.ki-delegation]

[skills.ki-specs]

[skills.ki-guides]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-housekeeping-claude]

[skills.ki-housekeeping-codex]

[skills.ki-housekeeping-chatgpt]

[skills.ki-acquire-chatgpt]

[skills.ki-acquire-granola]

[skills.ki-work-housekeeping]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
areas.FND = "foundation-tooling"
areas.GOV = "governance-consistency"
areas.OPS = "operations"
areas.REV = "regular-reviews"
areas.RTP = "runtime-portability"

[skills.ki-checkpoint]

[skills.ki-tokenomics]
headroom = "recommended"
# Cross-skill governance benefits from the higher-reasoning project default.
preferred_model_type = "reasoning"
budgets.mcp_servers = 20 # User-scoped; revisit if the global MCP set is pruned.

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-model-radar]

[skills.ki-agentic-radar]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]

# Maintenance intake is limited to the explicitly named KI repositories below.
# Do not add formal routes to HNR, legal, personal or other company groups.
# Standing knowledge intake is not execution, publication or acceptance authority.

[skills.ki-trades.subtypes.knowledge]
shared-capability-maintenance = "Non-sensitive findings about receiver-owned KI skills and governance: defects, compatibility, convention gaps and method outcomes. Excludes acquired user data, business content and credentials; grants no execution authority."

[skills.ki-trades.routes."knowledgeislands/apps-observatory"]
export = ["knowledge"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/apps-observatory".standing.import]
