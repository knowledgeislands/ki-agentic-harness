# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = [
  "knowledgeislands/ki-agent-backpack",
]

[skills.ki-repo]
repo_type = "project"
primary_shape = "ki-repo-backpack"
repository = "https://github.com/knowledgeislands/ki-agent-backpack"
title = "Knowledge Islands Agent Backpack"
capital = "https://github.com/knowledgeislands/ki-principal"
description = "Knowledge Islands agent backpack — canonical home for Agent Skills, Agents, Evals, and Hooks across the ecosystem."
repo_code = "KI-HARNESS"
visibility = "public"
license = "MIT"
supported_runtimes = [
  "claude-code",
  "claude-desktop",
  "chatgpt-codex",
]
# source repository publishes the optional capability without adopting a checkpoint subarea
checks.coverage-work-package = false
# source repository publishes the adapter without adopting Codex agent projections
checks.coverage-subagents-chatgpt = false

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-backpack]
prefix = "ki"

